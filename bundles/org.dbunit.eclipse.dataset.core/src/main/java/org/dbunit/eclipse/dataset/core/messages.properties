Validator_columnNotInFirstRow=Column "{0}" of table "{1}" is missing from the first element, so dbUnit ignores its value in this row.
Validator_firstElementWithoutAttributes=The first element of table "{0}" has no attributes, so dbUnit ignores every column of its later rows.
Validator_tableNameCaseVariants=Table "{0}" is also spelled "{1}".
Validator_columnNameCaseVariants=Column "{0}" of table "{1}" is also spelled "{2}".
Validator_duplicateColumnInRow=Attribute "{0}" repeats an earlier attribute that differs only in case; its value wins.
Validator_tableNotDeclaredInDtd=Table "{0}" is not declared in the DTD, so dbUnit fails to load the dataset.
Validator_columnNotDeclaredInDtdWarning=Column "{0}" of table "{1}" is not declared in the DTD, so dbUnit ignores its values.
Validator_columnNotDeclaredInDtdError=Column "{0}" of table "{1}" is not declared in the DTD, so dbUnit fails to load the dataset with column sensing enabled.
Validator_dtdTableWithoutDeclaration=The DTD content model names "{0}", which the DTD does not declare, so dbUnit fails to load the dataset.
Validator_dtdNotLoaded=The DOCTYPE's external DTD could not be read.
Validator_redundantEmptyElement=This empty element is redundant; table "{0}" already has rows.
