source.. = src/main/java/
output.. = target/classes/
# Tycho builds the UI tests into a fragment whose imports bnd computes. bnd would import each package
# that Eclipse splits between two bundles, such as org.eclipse.jface.text, from one bundle alone, which
# hides the other bundle's classes during the tests. Requiring these bundles instead, as the host does,
# gives the fragment every part of those packages.
additional.bundles = org.eclipse.jface.text,\
                     org.eclipse.core.runtime
bin.includes = META-INF/,\
               .,\
               plugin.properties,\
               plugin.xml,\
               icons/
