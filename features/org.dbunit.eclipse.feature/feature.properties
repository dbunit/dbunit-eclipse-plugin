featureName = dbUnit Dataset Editor

providerName = dbUnit

descriptionURL = https://dbunit.github.io/dbunit-eclipse-plugin/

description = \
Edit dbUnit dataset files like a spreadsheet.\n\
\n\
Version 1 supports the dbUnit flat XML dataset format: each table is a sheet,\n\
each row element is a spreadsheet row, and each attribute is a cell.\n\
Edits are written back into the XML text with minimal changes, so comments,\n\
formatting, and the DOCTYPE are preserved.\n\
\n\
Requires Eclipse 2024-06 or newer running on Java 17 or newer.

